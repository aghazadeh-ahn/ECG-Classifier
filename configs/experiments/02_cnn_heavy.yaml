name: 02_cnn_heavy
processed_dir: data/processed
seed: 42
train:
  epochs: 100
  patience: 20
  batch_size: 16
  lr: 0.001
  min_lr: 1.0e-6
  weight_decay: 0.0001
augment:
  noise_std: 0.05
  cutout_seconds: 0.5
  stretch: 0.05
  scale_min: 0.9
  scale_max: 1.1
model:
  name: cnn1d
  channels: [64, 128, 256, 384, 384]
  kernels: [7, 5, 5, 3, 3]
  dropout: 0.2
