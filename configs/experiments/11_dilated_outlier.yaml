name: 11_dilated_outlier
processed_dir: data/processed
seed: 42
train:
  epochs: 100
  patience: 20
  batch_size: 16
  lr: 0.001
  min_lr: 1.0e-6
  weight_decay: 0.0001
augment:
  noise_std: 0.05
  cutout_seconds: 0.5
  stretch: 0.05
  scale_min: 0.9
  scale_max: 1.1
model:
  name: dilated_outlier
  channels: [16, 32, 64, 128]
  dilations: [1, 2, 4, 8]
  dropout: 0.2
